name: Tests

# Runs once per change: on every pull request, and again after it is merged into main.
# (Running on every push as well would test each pull request twice.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-check

  functions:
    name: Server functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:functions
      - run: npm run test:functions

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Starts a local Postgres in Docker, applies every migration, then runs the pgTAP tests.
      - run: npx supabase db start
      - run: npx supabase test db
